name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#1F2B38' --splashBackgroundColor '#1F2B38'
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DiamondHairSalon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DiamondHairSalon-apk
          path: DiamondHairSalon.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Diamond Hair Cutting Salon build ${{ github.run_number }}
          files: DiamondHairSalon.apk
